[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegraph-writer"
version = "2.7.0"
description = "Cliente de escritorio para Telegra.ph: editor Markdown para crear, publicar y actualizar artículos"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Jose Antonio Seguido Doblado", email = "jose.antonio.seguido@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.42"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
telegraph-writer = "telegraph_writer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
